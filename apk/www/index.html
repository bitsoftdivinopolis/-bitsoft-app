<title>Bitsoft Tecnologia</title>
<style>
:root{--blue:#193ee8;--lime:#dfff8e;--bg:#f2f4fa;--card:#fff;--txt:#101738;--mut:#59628a;--line:#e0e5f2;--pri:#193ee8;--sh:0 2px 14px #1a2a7a14;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f2e;--card:#141b45;--txt:#eef0ff;--mut:#a4acd4;--line:#263060;--pri:#8fa6ff;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f2e;--card:#141b45;--txt:#eef0ff;--mut:#a4acd4;--line:#263060;--pri:#8fa6ff;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--blue);z-index:60}
h1,h2,h3,.sg{font-family:"Space Grotesk",system-ui,sans-serif;letter-spacing:-.03em;margin:0}
p{margin:0}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff;padding:12px 18px}
.bar img{height:26px}.bar .t{flex:1;font-weight:600;font-size:17px;text-align:right;opacity:.92}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;color:#fff}
main{padding:18px 18px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block;animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{background:var(--blue);color:#fff;border-radius:24px;padding:24px;position:relative;overflow:hidden;margin:-2px 0 20px}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(#ffffff2a,transparent 70%)}
.hero small,.k{font:600 11px/1 monospace;letter-spacing:.09em;text-transform:uppercase}
.hero small{color:var(--lime);display:flex;gap:8px;align-items:center}.hero small i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
.hero h1{font-size:34px;line-height:1.02;margin:14px 0 10px}.hero p{color:#e7ebff;font-size:15px;max-width:300px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--lime);color:#102444;font-weight:700;padding:14px 20px;border-radius:14px;margin-top:18px;transition:transform .15s}
.btn:active{transform:scale(.97)}.btn.blue{background:var(--blue);color:#fff}.btn.full{width:100%}.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 12px}.sec h2{font-size:21px}.sec button{color:var(--pri);font-weight:600;font-size:14px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:var(--card);border-radius:18px;padding:14px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;box-shadow:var(--sh);border:1px solid var(--line);transition:transform .15s}
.qa button:active{transform:scale(.94)}.qa .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--blue);color:#fff}.qa .ic.l{background:var(--lime);color:#102444}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.sc{flex:0 0 78%;scroll-snap-align:start;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--line);text-align:left}
.pic{aspect-ratio:1.9;background:#dbe6ff center/cover;display:grid;place-items:center}
.chip{width:62px;height:62px;border-radius:10px;background:linear-gradient(135deg,#678cff,#1b3ddd);border:4px solid #789afa;outline:2px dashed #597ab8;outline-offset:2px;color:#fff;font:700 15px monospace;display:grid;place-items:center;transform:skewY(-8deg)}
.sc .b{padding:14px 16px 16px}.sc h3{font-size:18px}.sc p{color:var(--mut);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left}.row .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none}
.row b{display:block}.row span{color:var(--mut);font-size:13px}.row .ch{margin-left:auto;color:var(--mut)}
.ttl{font-size:28px;margin:4px 0 4px}.sub{color:var(--mut);margin-bottom:18px}
.lst .card{padding:0;overflow:hidden}.lst .pic{aspect-ratio:2.3}.lst .b{padding:16px}
.steps{display:flex;gap:6px;margin-bottom:20px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:.3s}.steps i.on{background:var(--blue)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:.15s}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 8%,var(--card))}.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-left:auto;display:grid;place-items:center;flex:none}.opt.sel .rd{background:var(--blue);border-color:var(--blue);color:#fff}.opt .rd svg{width:14px;height:14px;stroke-width:3;opacity:0}.opt.sel .rd svg{opacity:1}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 8px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;outline:0}input:focus,textarea:focus{border-color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{padding:10px 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14px}.chips button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.nav2{display:flex;gap:10px;margin-top:22px}.nav2 .btn{margin:0;flex:1}
.sum dt{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:12px}.sum dd{margin:2px 0 0;font-weight:600}
.ck{display:flex;gap:12px;align-items:flex-start;padding:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.ck .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#102444}.ck.d .bx{background:var(--lime);border-color:var(--lime)}.ck.d span{opacity:.55;text-decoration:line-through}.ck .bx svg{width:14px;height:14px;stroke-width:3;opacity:0}.ck.d .bx svg{opacity:1}
.pg{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 16px}.pg i{display:block;height:100%;background:var(--blue);width:0;transition:.3s}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;z-index:40;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0;border-radius:14px;transition:.2s}.tabs button.on{color:var(--pri)}.tabs button.on svg{transform:translateY(-2px) scale(1.12)}
.tabs .mid{position:relative;top:-16px}.tabs .mid span.f{width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #193ee866;border:4px solid var(--bg)}.tabs .mid{color:var(--pri)}
#sheet{position:fixed;inset:0;z-index:70;display:none}#sheet.on{display:block}.sh-bg{position:absolute;inset:0;background:#050a2480;animation:fd .25s}
.sh{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow:auto;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.sh::before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
.sh h3{font-size:24px}.sh ul{padding-left:20px;color:var(--mut)}.sh li{margin:6px 0}
@keyframes up{from{transform:translate(-50%,100%)}}@keyframes fd{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#101738;color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:80;white-space:nowrap}#toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:100;background:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:#fff;transition:opacity .5s,visibility .5s,transform .5s;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:36px 36px}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.06)}
#splash .sym{width:150px;animation:pop .9s cubic-bezier(.2,1.2,.3,1) both}#splash .lg{width:170px;animation:pop .9s .25s cubic-bezier(.2,1.2,.3,1) both}
#splash .ld{width:120px;height:4px;border-radius:4px;background:#ffffff33;overflow:hidden;animation:pop .6s .5s both}#splash .ld i{display:block;height:100%;background:var(--lime);animation:ld 1.8s .3s ease-out forwards;width:0}
#splash small{font:600 11px monospace;letter-spacing:.14em;color:#cdd8ff;animation:pop .6s .6s both}
@keyframes pop{from{opacity:0;transform:scale(.7)}}@keyframes ld{to{width:100%}}

function rOrc(){const v=$("#v-orc"),stp=`<div class="steps">${[0,1,2].map(i=>`<i class="${i<=st.step?"on":""}"></i>`).join("")}</div>`;
if(st.step===0)v.innerHTML=`${stp}<h1 class="ttl">Qual serviço?</h1><p class="sub">Escolha o que mais se aproxima do que você precisa.</p>${S.map(s=>`<button class="opt ${st.svc===s.id?"sel":""}" data-o="${s.id}"><div><b>${s.n}</b></div><span class="rd">${ic("ok")}</span></button>`).join("")}<button class="btn blue full" id="nx" ${st.svc?"":"disabled style='opacity:.4'"}>Continuar</button>`;
else if(st.step===1)v.innerHTML=`${stp}<h1 class="ttl">Conte um pouco</h1><p class="sub">${S.find(x=>x.id===st.svc).n}</p><label for="nm">Seu nome</label><input id="nm" autocomplete="name" value="${st.nome}" placeholder="Como podemos te chamar?"><label>Urgência</label><div class="chips">${["Hoje","Esta semana","Sem pressa"].map(u=>`<button data-u="${u}" class="${st.urg===u?"sel":""}">${u}</button>`).join("")}</div><label for="ds">O que está acontecendo?</label><textarea id="ds" rows="4" maxlength="850" placeholder="Ex.: meu notebook trava quando abro o Excel.">${st.desc}</textarea><div class="nav2"><button class="btn ghost" id="bk">Voltar</button><button class="btn blue" id="nx">Revisar</button></div>`;
else v.innerHTML=`${stp}<h1 class="ttl">Revise e envie</h1><p class="sub">Você poderá editar a mensagem no WhatsApp antes de enviar.</p><div class="card"><dl class="sum" style="margin:0"><dt>Serviço</dt><dd>${S.find(x=>x.id===st.svc).n}</dd><dt>Nome</dt><dd>${st.nome||"Não informado"}</dd><dt>Urgência</dt><dd>${st.urg}</dd><dt>Descrição</dt><dd>${st.desc||"Não informada"}</dd></dl></div><div class="nav2"><button class="btn ghost" id="bk">Editar</button><button class="btn blue" id="snd">${ic("wa")} Enviar</button></div>`;
v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{vib();st.svc=b.dataset.o;rOrc()});
v.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{vib();st.urg=b.dataset.u;st.nome=$("#nm").value;st.desc=$("#ds").value;rOrc()});
const sync=()=>{if($("#nm")){st.nome=$("#nm").value.trim();st.desc=$("#ds").value.trim()}};
if($("#nx"))$("#nx").onclick=()=>{if(!st.svc)return;sync();st.step++;vib();rOrc();scrollTo({top:0})};
if($("#bk"))$("#bk").onclick=()=>{sync();st.step--;rOrc();scrollTo({top:0})};
if($("#snd"))$("#snd").onclick=()=>{const s=S.find(x=>x.id===st.svc);try{localStorage.setItem("bs_nome",st.nome)}catch(e){}
const m=`Olá, Bitsoft! ${st.nome?"Sou "+st.nome+". ":""}Gostaria de um orçamento para ${s.n}. Urgência: ${st.urg}.${st.desc?" "+st.desc:""}`;
const a=ld();a.unshift({s:s.s,dt:new Date().toLocaleDateString("pt-BR")});sv(a);st.step=0;st.svc=null;st.desc="";window.open(wl(m),"_blank","noopener");toast("Abrindo o WhatsApp…");setTimeout(()=>go("home"),400)}}
function rDicas(){const v=$("#v-dicas");
if(!st.tip){v.innerHTML=`<h1 class="ttl">Ajuda rápida</h1><p class="sub">Escolha o problema e siga o passo a passo antes de chamar o técnico.</p>${Object.entries(T).map(([k,x])=>`<button class="card row" data-tp="${k}"><span class="ic">${ic("dicas")}</span><b>${x[0]}</b><span class="ch">${ic("chev")}</span></button>`).join("")}`;
v.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{vib();st.tip=b.dataset.tp;st.done={};rDicas();scrollTo({top:0})});return}
const x=T[st.tip],items=x[1].split("|"),n=Object.values(st.done).filter(Boolean).length;
v.innerHTML=`<button class="k" id="bk" style="color:var(--pri);margin-bottom:10px">← Voltar</button><h1 class="ttl">${x[0]}</h1><p class="sub">${n} de ${items.length} passos feitos</p><div class="pg"><i style="width:${n/items.length*100}%"></i></div>${items.map((t,i)=>`<button class="ck ${st.done[i]?"d":""}" data-c="${i}"><span class="bx">${ic("ok")}</span><span>${t}</span></button>`).join("")}<div class="card" style="margin-top:16px"><b>Não resolveu?</b><p style="color:var(--mut);font-size:14px;margin-top:4px">Fale com um técnico da Bitsoft. Já levamos o problema na mensagem.</p><button class="btn blue full" data-w="Olá, Bitsoft! Estou com este problema: ${x[0]}. Já tentei os passos do app e não resolveu.">${ic("wa")} Falar com o técnico</button></div>`;
$("#bk").onclick=()=>{st.tip=null;rDicas()};
v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{vib();st.done[b.dataset.c]=!st.done[b.dataset.c];rDicas()});bind()}
let dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e});
function rCont(){const o=ld();$("#v-cont").innerHTML=`<h1 class="ttl">Fale com a gente</h1><p class="sub">Atendimento em Divinópolis, MG.</p>
<button class="card row" data-w="Olá, Bitsoft!"><span class="ic">${ic("wa")}</span><div><b>WhatsApp</b><span>(87) 98137-6760</span></div><span class="ch">${ic("chev")}</span></button>
<button class="card row" data-l="mailto:${MAIL}"><span class="ic">${ic("mail")}</span><div><b>E-mail</b><span>${MAIL}</span></div><span class="ch">${ic("chev")}</span></button>
<button class="card row" data-l="${IG}"><span class="ic">${ic("ig")}</span><div><b>Instagram</b><span>@bitsoftdivinopolis</span></div><span class="ch">${ic("chev")}</span></button>
<div class="card row"><span class="ic">${ic("pin")}</span><div><b>Divinópolis / MG</b><span>Atendimento na cidade</span></div></div>
<div class="sec"><h2>Meus pedidos</h2></div>${o.length?o.map(x=>`<div class="card row"><span class="ic">${ic("ok")}</span><div><b>${x.s}</b><span>${x.dt}</span></div></div>`).join(""):`<div class="card" style="color:var(--mut)">Nenhum pedido enviado ainda.</div>`}
<div class="sec"><h2>Sobre a Bitsoft</h2></div><div class="card" style="color:var(--mut)">Somos uma equipe de tecnologia em Divinópolis. Reunimos assistência de informática, suporte para empresas e criação digital. Primeiro entendemos como você usa o equipamento ou o que quer criar, depois apresentamos opções, custo e prazo.</div>
<button class="btn blue full" id="inst">${ic("dl")} Instalar o app</button>`;bind();
$("#inst").onclick=()=>{if(dp){dp.prompt();dp=null}else sheet(`<h3>Instalar o app</h3><p style="color:var(--mut);margin-top:8px"><b>Android (Chrome):</b> toque em ⋮ e depois em “Instalar app” ou “Adicionar à tela inicial”.</p><p style="color:var(--mut);margin-top:10px"><b>iPhone (Safari):</b> toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p>`)}}
function bind(){document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go(b.dataset.g));
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{vib();openS(b.dataset.s)});
document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{vib();window.open(wl(b.dataset.w),"_blank","noopener")});
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{vib();window.open(b.dataset.l,"_blank","noopener")})}
$("#wa").innerHTML=ic("wa");$("#wa").onclick=()=>window.open(wl("Olá, Bitsoft!"),"_blank","noopener");
go("home");setTimeout(()=>{$("#splash").classList.add("out");setTimeout(()=>$("#splash").remove(),600)},2300);
</script></body></html>
